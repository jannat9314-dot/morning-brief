name: Daily Morning Brief

on:
  schedule:
    # This runs at 01:30 UTC every day (Approx 7:00 AM IST)
    - cron: '30 1 * * *'
  workflow_dispatch: # This allows you to also run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai

      - name: Run script
        env:
          # Connecting your GitHub Secrets to the Environment Variables
          EMAIL: ${{ secrets.EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          OPENAI_API: ${{ secrets.OPENAI_API }}
          NEWS_API: ${{ secrets.NEWS_API }}
          WEATHER_API: ${{ secrets.WEATHER_API }}
        run: python main.py
